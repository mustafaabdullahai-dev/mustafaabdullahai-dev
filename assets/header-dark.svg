  <text x="104" y="100" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="#ffffff">Abdullah Mustafa</text>
  <text x="106" y="146" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="url(#haccent)">AI Engineer &#183; Full-Stack Developer &#183; AI Automation</text>
  <text x="106" y="182" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" fill="#8b949e">@mustafaabdullahai-dev</text>
