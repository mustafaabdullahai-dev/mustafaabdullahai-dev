<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Abdullah Mustafa — AI Engineer, Full-Stack Developer, AI Automation">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10251d"/>
    </linearGradient>
    <linearGradient id="haccent" x1="120" y1="0" x2="820" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ee6b0"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <filter id="hblur" x="-60%" y="-60%" width="220%" height="220%">
