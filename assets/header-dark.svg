    </filter>
  </defs>
  <rect width="1200" height="240" fill="url(#hbg)"/>
  <circle cx="1010" cy="30" r="150" fill="#5ee6b0" opacity="0.20" filter="url(#hblur)"/>
  <circle cx="1160" cy="220" r="130" fill="#79c0ff" opacity="0.18" filter="url(#hblur)"/>
